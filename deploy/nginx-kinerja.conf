# Potongan konfigurasi nginx untuk UMKMLinked (setara aturan kinerja di public/.htaccess).
# Tempel di dalam blok `server { ... }` situs ini, lalu: nginx -t && nginx -s reload

# Kompresi teks: HTML/CSS/JS/JSON/SVG/GeoJSON menyusut ±70–90%
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/geo+json image/svg+xml;

# Aset Vite bernama hash (berubah setiap build) → cache selamanya
location ^~ /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Foto & thumbnail produk, batas wilayah → cache 30 hari
location ~* ^/(storage/produk|geo)/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}

location = /geo/kalbar.geojson {
    default_type application/geo+json;
    add_header Cache-Control "public, max-age=2592000";
}
